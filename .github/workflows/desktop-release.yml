name: DSH Desktop

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing successful package run to publish without rebuilding
        required: false
        type: string
      release_tag:
        description: Release tag used with artifact_run_id
        required: false
        type: string
  push:
    tags:
      - desktop-v*

concurrency:
  group: dsh-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    if: inputs.artifact_run_id == ''
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            arch: arm64
            platform: darwin
            installer: DSH-Desktop-macOS-arm64.dmg
            portable: DSH-Desktop-macOS-arm64.zip
          - label: macOS x64
            os: macos-15-intel
            arch: x64
            platform: darwin
            installer: DSH-Desktop-macOS-x64.dmg
            portable: DSH-Desktop-macOS-x64.zip
          - label: Windows arm64
            os: windows-11-arm
            arch: arm64
            platform: win32
            installer: DSH-Desktop-Windows-arm64.exe
            portable: DSH-Desktop-Windows-arm64.zip
          - label: Windows x64
            os: windows-2025
            arch: x64
            platform: win32
            installer: DSH-Desktop-Windows-x64.exe
            portable: DSH-Desktop-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify native architecture
        shell: bash
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('expected ${{ matrix.arch }}, got ' + process.arch)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop application
        env:
          DSH_DESKTOP_BUILD_INSTALLER: '1'
        run: pnpm desktop:package

      - name: Archive macOS application
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "apps/desktop/out/DSH Desktop-darwin-${{ matrix.arch }}/DSH Desktop.app" \
            "apps/desktop/out/${{ matrix.portable }}"

      - name: Archive Windows application
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/desktop/out/DSH Desktop-win32-${{ matrix.arch }}/*" -DestinationPath "apps/desktop/out/${{ matrix.portable }}" -CompressionLevel Optimal

      # pnpm deploy --prod intentionally transitions the workspace modules to
      # production state. Restore test tooling before the packaged-app smoke.
      - name: Restore development dependencies
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile --prod=false

      - name: Test packaged macOS application
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          export DSH_DESKTOP_PACKAGED_EXECUTABLE="$PWD/apps/desktop/out/DSH Desktop-darwin-${{ matrix.arch }}/DSH Desktop.app/Contents/MacOS/DSH Desktop"
          pnpm --filter @deepseek-ai/dsh-desktop test:e2e

      - name: Test packaged Windows application
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_PACKAGED_EXECUTABLE = (Resolve-Path "apps/desktop/out/DSH Desktop-win32-${{ matrix.arch }}/DSH Desktop.exe")
          pnpm --filter @deepseek-ai/dsh-desktop test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/installers/${{ matrix.installer }}
            apps/desktop/out/${{ matrix.portable }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release assets
    if: always() && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.artifact_run_id != '')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find dist -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --prerelease \
              --generate-notes \
              --title "DSH Desktop ${RELEASE_TAG#desktop-v}" \
              --repo "$GITHUB_REPOSITORY"
          fi
